[project]
name = "mi-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jireth causil", email = "jirethcausildelgado@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "pika>=1.4.4",
    "psycopg2-binary>=2.9.13",
    "sqlmodel>=0.0.46",
]

[project.scripts]
mi-api = "mi_api:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

